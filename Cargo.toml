[package]
name = "tonia-sdk"
version = "0.4.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Official Rust client for tonia Pass"
repository = "https://github.com/tonia-router/rust-sdk"
readme = "README.md"
keywords = ["tonia", "openai", "anthropic", "llm"]
categories = ["api-bindings"]
exclude = ["target"]

[features]
default = ["realtime"]
realtime = ["dep:tokio-tungstenite"]
blocking = ["reqwest/blocking"]

[dependencies]
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2"
url = "2"
# url → idna 1.2.2+ / ICU 2.3 need rustc 1.86–1.88. Stay on 1.85.
idna_adapter = "=1.1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "time"] }
tokio-tungstenite = { version = "0.26", optional = true, default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
wiremock = "=0.6.4"
